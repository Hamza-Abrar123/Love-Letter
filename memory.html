<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Beautiful Memories ❤️</title>

    <link rel="stylesheet" href="memory.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Background -->
    <div class="stars"></div>
    <div class="overlay"></div>

    <!-- Story Card -->
    <div class="story-container">

        <!-- Progress -->
        <div class="progress-bar">
            <span class="progress active"></span>
            <span class="progress"></span>
            <span class="progress"></span>
            <span class="progress"></span>
            <span class="progress"></span>
        </div>

        <!-- Heading -->
        <div class="story-header">
            <h2>❤️ Our Beautiful Memories ❤️</h2>
        </div>

        <!-- Images -->
        <div class="story-images">
            <img src="Zainab.2.jpg" class="story-image active" alt="">
            <img src="Dr.Fatima.jfif" class="story-image" alt="">
            <img src="Dr.Sarah Ali.jfif" class="story-image" alt="">
            <img src="profile.jpg" class="story-image" alt="">
            <img src="Dr.Bilal.webp" class="story-image" alt="">
        </div>

        <!-- Touch Areas -->
        <div class="story-touch">
            <div id="leftTap"></div>
            <div id="rightTap"></div>
        </div>

        <div class="tap-text">
            👆 Tap anywhere to continue
        </div>

        <!-- Quote -->
        <div class="story-text">
            <h1>Every Memory Has A Story...</h1>

            <p id="caption">
                Every picture reminds me that beautiful moments become unforgettable when shared with someone special.
            </p>
        </div>

    </div>

    <script src="memory.js"></script>

</body>

</html>
