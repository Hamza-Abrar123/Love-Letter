<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

    <!-- Background -->

            <span class="progress active"></span>

            <span class="progress"></span>

            <span class="progress"></span>

            <span class="progress"></span>

        <div class="story-header">

        </div>

        <!-- Images -->

        <div class="story-images">

            <img src="Zainab.2.jpg" class="story-image active">

            <img src="Dr.Fatima.jfif" class="story-image">

            <img src="profile.jpg" class="story-image">

            <img src="Dr.Bilal.webp" class="story-image">

        </div>

<div class="story-touch">

    <div id="leftTap"></div>

    <div id="rightTap"></div>

</div>

<div class="tap-text">
    👆 Tap anywhere to continue
</div>






        <!-- Romantic Quote -->

    <!-- Music Button -->

   

    <script src="memory.js"></script>
